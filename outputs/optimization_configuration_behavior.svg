<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="#ffffff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .title{font-size:40px;font-weight:700}
    .sub{font-size:21px;fill:#6b7280}
    .h{font-size:25px;font-weight:700}
    .small{font-size:16px;fill:#6b7280}
    .lab{font-size:19px;font-weight:700}
    .axis{stroke:#111827;stroke-width:2}
    .grid{stroke:#e5e7eb;stroke-width:1}
    .panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}
  </style>
  <text x="60" y="62" class="title">System Behaviour Under Different NSGA-II Configuration Settings</text>
  <text x="62" y="100" class="sub">Stats shown: convergence speed proxy, hypervolume, runtime and Pareto front size</text>

  <g transform="translate(60,140)">
    <rect class="panel" x="0" y="0" width="700" height="330" rx="14"/>
    <text x="25" y="45" class="h">Pareto Front Size</text>
    <text x="25" y="75" class="small">Non-dominated solutions</text>
    <line class="axis" x1="70" y1="260" x2="650" y2="260"/>
    <line class="axis" x1="70" y1="95" x2="70" y2="260"/>
    <line class="grid" x1="70" y1="219" x2="650" y2="219"/>
    <line class="grid" x1="70" y1="178" x2="650" y2="178"/>
    <line class="grid" x1="70" y1="136" x2="650" y2="136"/>
    <line class="grid" x1="70" y1="95" x2="650" y2="95"/>
    <rect x="145" y="244" width="85" height="16" rx="7" fill="#6b7280"/><text x="178" y="235" class="lab">1</text>
    <rect x="308" y="178" width="85" height="82" rx="7" fill="#0f766e"/><text x="341" y="169" class="lab">5</text>
    <rect x="471" y="112" width="85" height="148" rx="7" fill="#b45309"/><text x="504" y="103" class="lab">9</text>
    <text x="172" y="295" class="lab">Low</text><text x="150" y="318" class="small">Pop 10, Gen 5</text>
    <text x="307" y="295" class="lab">Moderate</text><text x="300" y="318" class="small">Pop 20, Gen 10</text>
    <text x="493" y="295" class="lab">High</text><text x="463" y="318" class="small">Pop 30, Gen 15</text>
  </g>

  <g transform="translate(840,140)">
    <rect class="panel" x="0" y="0" width="700" height="330" rx="14"/>
    <text x="25" y="45" class="h">Hypervolume Indicator</text>
    <text x="25" y="75" class="small">log10 scale; labels show actual values</text>
    <line class="axis" x1="70" y1="260" x2="650" y2="260"/>
    <line class="axis" x1="70" y1="95" x2="70" y2="260"/>
    <line class="grid" x1="70" y1="219" x2="650" y2="219"/>
    <line class="grid" x1="70" y1="178" x2="650" y2="178"/>
    <line class="grid" x1="70" y1="136" x2="650" y2="136"/>
    <line class="grid" x1="70" y1="95" x2="650" y2="95"/>
    <rect x="145" y="260" width="85" height="0" rx="7" fill="#6b7280"/><text x="155" y="245" class="lab">0.0000</text>
    <rect x="308" y="105" width="85" height="155" rx="7" fill="#0f766e"/><text x="260" y="96" class="lab">4.8722 x 10^18</text>
    <rect x="471" y="101" width="85" height="159" rx="7" fill="#b45309"/><text x="423" y="92" class="lab">8.8504 x 10^18</text>
    <text x="172" y="295" class="lab">Low</text><text x="150" y="318" class="small">Pop 10, Gen 5</text>
    <text x="307" y="295" class="lab">Moderate</text><text x="300" y="318" class="small">Pop 20, Gen 10</text>
    <text x="493" y="295" class="lab">High</text><text x="463" y="318" class="small">Pop 30, Gen 15</text>
  </g>

  <g transform="translate(60,535)">
    <rect class="panel" x="0" y="0" width="700" height="300" rx="14"/>
    <text x="25" y="45" class="h">Runtime Cost</text>
    <text x="25" y="75" class="small">Seconds</text>
    <line class="axis" x1="70" y1="235" x2="650" y2="235"/>
    <line class="axis" x1="70" y1="95" x2="70" y2="235"/>
    <line class="grid" x1="70" y1="200" x2="650" y2="200"/>
    <line class="grid" x1="70" y1="165" x2="650" y2="165"/>
    <line class="grid" x1="70" y1="130" x2="650" y2="130"/>
    <polygon points="188,204 350,174 513,114 513,235 188,235" fill="#ccfbf1" opacity=".65"/>
    <polyline points="188,204 350,174 513,114" fill="none" stroke="#0f766e" stroke-width="5"/>
    <circle cx="188" cy="204" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="156" y="178" class="lab">3.56s</text>
    <circle cx="350" cy="174" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="318" y="148" class="lab">6.93s</text>
    <circle cx="513" cy="114" r="9" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="476" y="88" class="lab">13.78s</text>
    <text x="172" y="270" class="lab">Low</text><text x="150" y="292" class="small">Pop 10</text>
    <text x="307" y="270" class="lab">Moderate</text><text x="300" y="292" class="small">Pop 20</text>
    <text x="493" y="270" class="lab">High</text><text x="463" y="292" class="small">Pop 30</text>
  </g>

  <g transform="translate(840,535)">
    <rect class="panel" x="0" y="0" width="700" height="300" rx="14"/>
    <text x="25" y="45" class="h">Convergence Speed Proxy</text>
    <text x="25" y="75" class="small">Generations completed per second</text>
    <line class="axis" x1="70" y1="235" x2="650" y2="235"/>
    <line class="axis" x1="70" y1="95" x2="70" y2="235"/>
    <line class="grid" x1="70" y1="196" x2="650" y2="196"/>
    <line class="grid" x1="70" y1="157" x2="650" y2="157"/>
    <line class="grid" x1="70" y1="118" x2="650" y2="118"/>
    <polygon points="188,126 350,123 513,151 513,235 188,235" fill="#fef3c7" opacity=".75"/>
    <polyline points="188,126 350,123 513,151" fill="none" stroke="#b45309" stroke-width="5"/>
    <circle cx="188" cy="126" r="9" fill="#fff" stroke="#b45309" stroke-width="4"/><text x="136" y="100" class="lab">1.40 gen/s</text>
    <circle cx="350" cy="123" r="9" fill="#fff" stroke="#b45309" stroke-width="4"/><text x="298" y="97" class="lab">1.44 gen/s</text>
    <circle cx="513" cy="151" r="9" fill="#fff" stroke="#b45309" stroke-width="4"/><text x="461" y="125" class="lab">1.09 gen/s</text>
    <text x="172" y="270" class="lab">Low</text><text x="150" y="292" class="small">Pop 10</text>
    <text x="307" y="270" class="lab">Moderate</text><text x="300" y="292" class="small">Pop 20</text>
    <text x="493" y="270" class="lab">High</text><text x="463" y="292" class="small">Pop 30</text>
  </g>

  <text x="60" y="890" class="small">Convergence speed is derived as generations/runtime because the report table does not store per-generation objective-slope logs.</text>
  <text x="60" y="922" class="sub">Interpretation: higher settings produced larger Pareto fronts and higher hypervolume, but required more runtime.</text>
</svg>
